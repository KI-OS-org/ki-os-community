<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KI-OS Control Console – R28 Control Plane Visible</title>
  <link rel="stylesheet" href="/console/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">KI-OS Control Console</div>
      <div class="subtitle">R28 · Control Plane Visible</div>
      <nav>
        <button data-view="command" class="active">Command Center</button>
        <button data-view="routing">Routing</button>
        <button data-view="governance">Governance</button>
        <button data-view="dag">DAG Runtime</button>
        <button data-view="traces">Traces</button>
      </nav>
    </aside>
    <main class="main">
      <header>
        <div>
          <h1 id="view-title">Command Center</h1>
          <div class="muted" id="view-subtitle">Live-Sicht auf Routing, Policies, Agenten und Ausführung.</div>
        </div>
        <div class="header-actions">
          <button id="refresh-btn">Refresh</button>
          <span id="status-pill">verbinde…</span>
        </div>
      </header>
      <section id="summary-grid" class="summary-grid"></section>
      <section id="content" class="content-grid"></section>
    </main>
  </div>
  <script src="/console/app.js"></script>
</body>
</html>
